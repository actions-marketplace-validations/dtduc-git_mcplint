# Example expectations for authenticated checks:
#   mcplint gate --auth auth-expectations.yaml https://your-gateway --allow-host
#
# Prefer --env-file over exporting secrets by hand:
#   mcplint gate --auth auth-expectations.yaml --env-file .env.local --allow-host
#
# Copy this file, set your target, and edit the lists. The key (and any
# upstream token) is read from the environment only — never put a credential
# in this file. Only the variables this file references must exist.
#
# Checks performed (all read-only):
#   AUTH001 forbidden_tools visible to the key        (high)
#   AUTH002 tools outside expect_tools                (medium)
#   AUTH003 forbidden_servers reachable via scoping   (high)
#   AUTH004 read_probe returns data (expected deny)   (critical)
#   AUTH005 expected tools missing                    (low, config drift)
#   AUTH006 read_probe denied although expect: allow  (medium, broken use case)
#
# Use a dedicated TEST key with a test user, not a real person's key.

target: http://localhost:4000
key: env/LITELLM_TEST_KEY

# Strict allowlist: every tool the key can see should be listed here.
# Leave the list empty (or delete it) to skip this check.
expect_tools:
  - confluence.search
  - confluence.get_page

# fnmatch patterns that must never be visible to this key.
forbidden_tools:
  - "*delete*"
  - "*update*"
  - "*admin*"

# Servers this key must not reach; probed with the x-mcp-servers header.
forbidden_servers:
  - github

# OPTIONAL: headers forwarded to the upstream MCP server (per-user tokens).
# Values are read from the environment — never put a token in this file.
# Example (LiteLLM per-user passthrough to a Confluence MCP server):
# upstream_headers:
#   x-mcp-confluence-authorization: env/ATLASSIAN_USER_TOKEN

# OPTIONAL and opt-in: one read-only tool call that must be denied upstream —
# use an object (page, issue, record) the test user is NOT allowed to access.
# Only put read-only tools here; write tools must never appear in this file.
# Only ONE read_probe is supported — uncomment exactly one of the two below
# (a duplicate YAML key would silently keep the last one).
# read_probe:
#   tool: confluence.get_page
#   args: { page_id: "00000000" }
#   expect: deny        # AUTH004 (critical) if data comes back
# read_probe:           # negative control: the user SHOULD have access
#   tool: confluence.get_page
#   args: { page_id: "11111111" }
#   expect: allow       # AUTH006 (medium) if this gets denied
