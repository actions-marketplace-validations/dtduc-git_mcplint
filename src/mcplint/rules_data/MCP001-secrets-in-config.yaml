id: MCP001
title: Hardcoded secret in MCP server configuration
severity: critical
owasp: "MCP01:2025 - Token Mismanagement & Secret Exposure"
check: secrets_in_config
targets: [config]
description: >
  A literal credential was found in an MCP server entry (env, args or headers).
  Configs are committed to git and read by agent tooling, so any literal secret
  in one should be considered compromised.
remediation: >
  Reference the secret from the environment (e.g. "${env:OPENAI_API_KEY}") or a
  secret manager, rotate the leaked credential, and keep local-only values out
  of version control.
params:
  patterns:
    - name: OpenAI API key
      regex: 'sk-[A-Za-z0-9_-]{20,}'
    - name: Anthropic API key
      regex: 'sk-ant-[A-Za-z0-9_-]{20,}'
    - name: GitHub token
      regex: 'gh[pousr]_[A-Za-z0-9]{20,}'
    - name: AWS access key id
      regex: 'AKIA[0-9A-Z]{16}'
    - name: Slack token
      regex: 'xox[baprs]-[A-Za-z0-9-]{10,}'
    - name: Google API key
      regex: 'AIza[0-9A-Za-z_-]{30,}'
    - name: Private key material
      regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
    - name: URL with embedded credentials
      regex: '[a-z][a-z0-9+.-]*://[^/\s:@]+:[^/\s@]+@'
    - name: Bearer token
      regex: '(?i)bearer\s+[A-Za-z0-9._-]{20,}'
  suspicious_env_key: '(?i)(api[_-]?key|secret|token|passwd|password|credential)'
  suspicious_header_key: '(?i)(api[_-]?key|secret|token|passwd|password|credential|authorization)'
  min_len: 12
